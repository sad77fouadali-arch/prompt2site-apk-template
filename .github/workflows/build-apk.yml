name: Build Client APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l'app client"
        required: true
      theme_color:
        description: "Couleur hex (ex: #6A0DAD)"
        required: true
      target_url:
        description: "URL du site client"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Injecter la config du client
        run: |
          CONFIG="app/src/main/java/com/prompt2site/template/AppConfig.kt"
          sed -i "s|com.prompt2site.client|com.prompt2site.$(echo '${{ inputs.app_name }}' | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')|g" app/build.gradle.kts
          sed -i "s|__APP_NAME__|${{ inputs.app_name }}|g" "$CONFIG"
          sed -i "s|__THEME_COLOR__|${{ inputs.theme_color }}|g" "$CONFIG"
          sed -i "s|__TARGET_URL__|${{ inputs.target_url }}|g" "$CONFIG"
          sed -i "s|__APP_NAME__|${{ inputs.app_name }}|g" app/src/main/AndroidManifest.xml
          sed -i "s|__THEME_COLOR__|${{ inputs.theme_color }}|g" app/src/main/res/values/colors.xml

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        run: gradle assembleDebug

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk

